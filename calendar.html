<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GIDE Calendar Print</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  body { margin: 0; background: #f3ede2; }
  #stage { position: fixed; inset: 0; overflow: hidden; display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 4961 / 3508)); height: auto; display: block; transform-origin: 0 0; }
  button { position: fixed; top: 10px; right: 10px; font: 600 13px Inter, system-ui, sans-serif; padding: 6px 10px;
           background: #fbf8f2; color: #2b2620; border: 1px solid #c9bfae; border-radius: 6px; cursor: pointer; }
  @media print { button { display: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="4961" height="3508"></canvas></div>
<button id="png" title="Click a node to toggle its label · scroll to zoom, drag to pan · double-click or 0 to reset">Export PNG (A3, 300 dpi)</button>
<script>
// Single print image (A3 landscape, 300 dpi) of the SSBD-merged view: sober light beige theme, a few labelled nodes.
// Positions are the same pre-computed ones the viewer uses (graph_ssbd.json + positions_ssbd.json).
const W = 4961, H = 3508, MARGIN = 160, STRIP = 300;  // px; STRIP = title/legend band at the bottom
const BG = "#f3ede2", INK = "#2b2620", MUTED = "#7a6f62";  // beige paper, dark ink
const FONT = "Inter, system-ui, sans-serif";
// desaturated mid tones that read on beige, away from the logo hues; Taxon (gold) vs DefinedTerm (indigo) kept far apart
const LEGEND = [["Person", "#7d98b3"], ["Keyword", "#8a6bb0"], ["Organization", "#7d8a96"], ["Taxon", "#c9a227"],
  ["ScholarlyArticle", "#c06c9a"], ["Dataset", "#4f9a90"], ["Grant", "#9c8fb8"], ["DefinedTerm", "#2e4a8c"]];
const OTHERS = "#b9b0a3";
const LOGOS = { "https://idr.openmicroscopy.org/": "logos/idr.svg", "https://ssbd.riken.jp/": "logos/ssbd.png",
  "https://www.ebi.ac.uk/bioimage-archive/": "logos/bia.png" }, LOGO_IMG = {};
const PUB_COLORS = { "https://idr.openmicroscopy.org/": "#ff3b30", "https://ssbd.riken.jp/": "#ffa31a",
  "https://www.ebi.ac.uk/bioimage-archive/": "#9be15d" };
// which nodes get a callout: [rule, ...]; top = most links within that class
const HIGHLIGHTS = [
  { top: 2, c: "Taxon" },
  { top: 2, c: "DefinedTerm" },
  { label: "zebrafish", c: "Keyword" },
  { label: "morphogenesis", c: "Keyword" },
];
const R_MIN = 1.5, R_MAX = 12, K = 8, INSIDE_X = 2, R_PUB = 36;  // same as the viewer (graph units)
const NODE_SCALE = 1.4;  // print enlargement of node radii, so the smallest dots still show on paper

const canvas = document.getElementById("c"), main = canvas.getContext("2d");
let c = main;  // drawing target: the cached base layer while building it, then the visible canvas
const colorOf = new Map(LEGEND);

Promise.all([fetch("graph_ssbd.json").then(r => r.json()), fetch("positions_ssbd.json").then(r => r.json()),
             document.fonts.load(`800 40px Inter`).catch(() => {}),
             ...Object.entries(LOGOS).map(([u, src]) => loadImage(src).then(img => LOGO_IMG[u] = img).catch(() => {}))])
  .then(([g, pos]) => { setup(g, pos); render(); });

// repository logos, served next to this page (same origin, so the canvas stays exportable)
function loadImage(src) {
  return new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });
}

// The full network (edges, nodes, titles, legend) is drawn once into an offscreen base layer.
// A click only repaints base + labels, so toggling a label is fast.
let nodes, links, X, Y, R, ox, oy, base, over, hit, selected, boxes = [];
// what is under the pointer: a label box (click removes it) or a node (click toggles it); background is not clickable
function target(ev) {
  if (!hit) return null;
  const rect = canvas.getBoundingClientRect(), k = W / rect.width;
  const x = (ev.clientX - rect.left) * k, y = (ev.clientY - rect.top) * k;
  const b = boxes.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (b) return b.p;
  const n = hit.find(x, y, 60);
  return n && Math.hypot(X(n) - x, Y(n) - y) <= R(n) + 6 * k ? n : null;
}
canvas.onmousemove = ev => { canvas.style.cursor = target(ev) ? "pointer" : "default"; };
// zoom/pan only magnifies the view (CSS transform) to make clicking easier; the image itself never changes
const stage = document.getElementById("stage");
const viewZoom = d3.zoom().scaleExtent([1, 15]).on("zoom", ({ transform: t }) => {
  // stage-space zoom applied to a centred canvas: translate so canvas point q lands at t.k * (offset + q) + t.x
  const ox0 = canvas.offsetLeft, oy0 = canvas.offsetTop;
  canvas.style.transform = `translate(${t.x + (t.k - 1) * ox0}px, ${t.y + (t.k - 1) * oy0}px) scale(${t.k})`;
});
const resetView = () => d3.select(stage).transition().duration(400).call(viewZoom.transform, d3.zoomIdentity);
d3.select(stage).call(viewZoom).on("dblclick.zoom", null).on("dblclick", ev => { if (!target(ev)) resetView(); });
addEventListener("keydown", e => { if (e.key === "0" || e.key === "Home") resetView(); });
canvas.onclick = ev => {
  const n = target(ev);
  if (!n) return;
  selected.has(n) ? selected.delete(n) : selected.add(n);
  render();
};

function setup(g, pos) {
  nodes = g.nodes;
  for (const n of nodes) {
    [n.x, n.y] = pos.pos[n.id];
    n.in = n.pub === undefined && n.p.length !== 1;
    const base = R_MIN + (R_MAX - R_MIN) * Math.tanh(n.k / K);
    n.r = n.pub !== undefined ? R_PUB : n.in ? INSIDE_X * base : base;
    n.color = n.pub !== undefined ? (PUB_COLORS[n.u] || "#ccc") : (colorOf.get(n.c) || OTHERS);
    n.adj = [];
  }
  links = g.links.map(([s, t]) => [nodes[s], nodes[t]]);
  for (const l of links) { l[0].adj.push(l); l[1].adj.push(l); }

  // fit graph into the area above the strip
  const xs = d3.extent(nodes, n => n.x), ys = d3.extent(nodes, n => n.y);
  const s = Math.min((W - 2 * MARGIN) / (xs[1] - xs[0]), (H - 2 * MARGIN - STRIP) / (ys[1] - ys[0]));
  ox = W / 2 - s * (xs[0] + xs[1]) / 2; oy = (H - STRIP) / 2 - s * (ys[0] + ys[1]) / 2;
  X = n => ox + s * n.x; Y = n => oy + s * n.y; R = n => Math.max(1.2, n.r * s * NODE_SCALE);
  hit = d3.quadtree(nodes.filter(n => n.pub === undefined), X, Y);

  selected = new Set();
  {
    for (const h of HIGHLIGHTS) {
      const cands = nodes.filter(n => n.c === h.c && (!h.label || n.l === h.label)).sort((a, b) => b.k - a.k);
      if (!cands.length) console.warn("highlight not found", h);
      cands.slice(0, h.top || 1).forEach(n => selected.add(n));
    }
  }

  // two cached layers so highlight edges sit between them: base = background + edges, over = nodes, titles, legend
  const layer = () => { const cv = document.createElement("canvas"); cv.width = W; cv.height = H; return cv; };
  base = layer(); over = layer();
  c = base.getContext("2d");
  c.fillStyle = BG; c.fillRect(0, 0, W, H);

  // edges: warm dark grey, faint
  c.lineWidth = 1.1;
  for (const [inner, alpha] of [[false, .035], [true, .08]]) {
    c.strokeStyle = `rgba(70,60,50,${alpha})`; c.beginPath();
    for (const [a, b] of links) {
      const isIn = a.in || b.in || a.pub !== undefined || b.pub !== undefined;
      if (isIn !== inner) continue;
      c.moveTo(X(a), Y(a)); c.lineTo(X(b), Y(b));
    }
    c.stroke();
  }

  c = over.getContext("2d");
  // outside nodes: faint, batched by colour
  c.globalAlpha = .45;
  for (const [col, ns] of d3.groups(nodes.filter(n => n.pub === undefined && !n.in), n => n.color)) {
    c.fillStyle = col; c.beginPath();
    for (const n of ns) { c.moveTo(X(n) + R(n), Y(n)); c.arc(X(n), Y(n), R(n), 0, 2 * Math.PI); }
    c.fill();
  }
  c.globalAlpha = 1;

  // polygon outline
  c.setLineDash([18, 14]); c.strokeStyle = "rgba(70,60,50,.35)"; c.lineWidth = 3;
  c.beginPath(); pos.polygon.forEach(([x, y], i) => c[i ? "lineTo" : "moveTo"](ox + s * x, oy + s * y)); c.closePath(); c.stroke();
  c.setLineDash([]);

  // inside (shared) nodes: opaque, thin beige outline so overlapping dots separate
  c.strokeStyle = BG; c.lineWidth = 2;
  for (const n of nodes.filter(n => n.in).sort((a, b) => a.r - b.r)) {
    c.fillStyle = n.color; c.beginPath(); c.arc(X(n), Y(n), R(n), 0, 2 * Math.PI); c.fill(); c.stroke();
  }

  // publishers
  const pubs = nodes.filter(n => n.pub !== undefined);
  for (const n of pubs) {
    const img = LOGO_IMG[n.u], r = R_PUB * s * NODE_SCALE * (img ? 1.6 : 1.2);
    if (img) {  // white disc with the logo, ringed in the logo colour
      c.fillStyle = "#fff"; c.strokeStyle = n.color; c.lineWidth = 10;
      c.beginPath(); c.arc(X(n), Y(n), r, 0, 2 * Math.PI); c.fill(); c.stroke();
      const box = r * 1.25, f = box / Math.max(img.width, img.height), w = img.width * f, h = img.height * f;
      c.drawImage(img, X(n) - w / 2, Y(n) - h / 2, w, h);
    } else {
      c.fillStyle = n.color; c.strokeStyle = BG; c.lineWidth = 6;
      c.beginPath(); c.arc(X(n), Y(n), r, 0, 2 * Math.PI); c.fill(); c.stroke();
    }
    // title outside the polygon: above top corners, below bottom ones
    const up = n.y < 0, fs = 92;
    c.font = `800 ${fs}px ${FONT}`; c.textAlign = "center"; c.textBaseline = up ? "bottom" : "top";
    c.lineJoin = "round"; c.strokeStyle = BG; c.lineWidth = 18; c.fillStyle = d3.color(n.color).darker(.7).formatHex();
    const ty = Y(n) + (up ? -r - 30 : r + 30);
    c.strokeText(n.l, X(n), ty); c.fillText(n.l, X(n), ty);
  }

  // bottom strip: title + legend
  const sy = H - STRIP;
  c.fillStyle = "rgba(70,60,50,.15)"; c.fillRect(MARGIN, sy, W - 2 * MARGIN, 2);
  c.textAlign = "left"; c.textBaseline = "alphabetic";
  c.fillStyle = INK; c.font = `800 76px ${FONT}`;
  c.fillText("Harmonized bioimage metadata via FoundingGIDE", MARGIN, sy + 120);
  c.fillStyle = MUTED; c.font = `400 40px ${FONT}`;
  c.fillText(`Metadata nodes in the FoundingGIDE project · ${nodes.length.toLocaleString("en")} entities · ${links.length.toLocaleString("en")} links · inside the triangle: shared by two or more repositories`, MARGIN, sy + 190);
  let lx = W - MARGIN;
  c.font = `600 36px ${FONT}`; c.textAlign = "right";
  for (const [name, col] of [...LEGEND].reverse()) {
    const label = name.replace(/([a-z])([A-Z])/g, "$1 $2");
    c.fillStyle = INK; c.fillText(label, lx, sy + 160);
    lx -= c.measureText(label).width + 24;
    c.fillStyle = col; c.beginPath(); c.arc(lx, sy + 147, 14, 0, 2 * Math.PI); c.fill();
    lx -= 70;
  }
  c = main;
}

function render() {
  c.drawImage(base, 0, 0);
  boxes = [];
  const picked = [...selected];
  // highlighted nodes: their edges in their own colour
  c.lineWidth = 2;
  for (const p of picked) {
    c.strokeStyle = hexA(p.color, .25); c.beginPath();
    for (const [a, b] of p.adj) { c.moveTo(X(a), Y(a)); c.lineTo(X(b), Y(b)); }
    c.stroke();
  }
  c.drawImage(over, 0, 0);


  // callouts on slots around an ellipse; slots skip straight up (IDR title) and the bottom corners (BIA/SSBD titles)
  const SLOTS = [-155, -118, 175, 90, 5, -62, -25].map(d => d * Math.PI / 180);
  const BOX_H = 140, ecx = W / 2, ecy = (H - STRIP) / 2, erx = .42 * W, ery = .42 * (H - STRIP);
  for (const p of picked) { c.strokeStyle = hexA(p.color, .8); c.lineWidth = 5; c.beginPath(); c.arc(X(p), Y(p), R(p) + 8, 0, 2 * Math.PI); c.stroke(); }
  // match nodes to slots in the same cyclic order (no crossings), picking the rotation with the shortest leaders
  const angle = (x, y) => Math.atan2(y - oy, x - ox);
  const ps = [...picked].sort((a, b) => angle(X(a), Y(a)) - angle(X(b), Y(b)));
  // more labels than hand-picked slots (after clicking): spread them evenly around the ellipse instead
  const slots = ps.length <= SLOTS.length ? SLOTS.slice(0, ps.length) : d3.range(ps.length).map(i => -Math.PI + (i + .5) * 2 * Math.PI / ps.length);
  const ss = slots.map(t => [ecx + erx * Math.cos(t), ecy + ery * Math.sin(t)])
    .sort((a, b) => angle(...a) - angle(...b));
  const cost = k => d3.sum(ps, (p, i) => Math.hypot(ss[(i + k) % ss.length][0] - X(p), ss[(i + k) % ss.length][1] - Y(p)));
  const best = ss.length ? d3.minIndex(d3.range(ss.length), cost) : 0;
  ps.forEach((p, i) => {
    const [sx, sy0] = ss[(i + best) % ss.length];
    const title = p.c.replace(/([a-z])([A-Z])/g, "$1 $2").toUpperCase() + (curie(p) ? `  ·  ${curie(p)}` : ""),
      text = p.c === "Keyword" ? `"${p.l}"` : p.l;  // keywords are plain strings, not identified terms
    c.font = `800 64px ${FONT}`; const tw = c.measureText(text).width;
    c.font = `600 30px ${FONT}`; const sw = c.measureText(title).width;
    const bw = Math.max(tw, sw) + 70, bh = BOX_H;
    const bx = Math.min(Math.max(sx - bw / 2, MARGIN / 2), W - MARGIN / 2 - bw);
    const by = Math.min(Math.max(sy0 - bh / 2, MARGIN / 2), H - STRIP - bh - 20);
    const lx = Math.min(Math.max(X(p), bx), bx + bw), ly = Math.min(Math.max(Y(p), by), by + bh);  // nearest box point
    const ang = Math.atan2(ly - Y(p), lx - X(p)), rr = R(p) + 8;
    c.strokeStyle = hexA(p.color, .8); c.lineWidth = 4;
    c.beginPath(); c.moveTo(X(p) + Math.cos(ang) * rr, Y(p) + Math.sin(ang) * rr); c.lineTo(lx, ly); c.stroke();
    boxes.push({ x: bx, y: by, w: bw, h: bh, p });
    c.fillStyle = "#fbf8f2"; c.strokeStyle = hexA(p.color, .85);
    c.beginPath(); c.roundRect(bx, by, bw, bh, 28); c.fill(); c.stroke();
    c.textAlign = "left"; c.textBaseline = "alphabetic";
    c.fillStyle = p.color; c.font = `600 30px ${FONT}`; c.fillText(title, bx + 35, by + 50);
    c.fillStyle = INK; c.font = `800 64px ${FONT}`; c.fillText(text, bx + 35, by + 112);
  });
  window.READY = true;  // for headless checks
}
// harmonised OBO IRI -> CURIE (http://purl.obolibrary.org/obo/NCBITaxon_9606 -> NCBITaxon:9606); keywords have none
function curie(n) {
  const m = /purl\.obolibrary\.org\/obo\/([A-Za-z]+)_(\w+)$/.exec(n.u || "");
  return m ? `${m[1]}:${m[2]}` : null;
}

function hexA(hex, a) {
  const { r, g, b } = d3.color(hex).rgb();
  return `rgba(${r},${g},${b},${a})`;
}

document.getElementById("png").onclick = () =>
  canvas.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "gide_calendar_A3.png"; a.click(); });
</script>
</body>
</html>
